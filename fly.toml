# fly.toml app configuration file generated for chatgpt-master-suiet on 2026-11-02T11:09:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chatgpt-master-suiet'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  HOST = '0.0.0.0'
  PORT = '8888'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
